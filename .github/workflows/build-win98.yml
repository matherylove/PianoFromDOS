name: Build PianoFromDOS for Windows 98

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MINGW_LITE_VERSION: 16.2.0-r1
  MINGW_LITE_ARCHIVE: x-mingw32_686-msvcrt_win98-16.2.0-r1.tar.zst
  MINGW_LITE_SHA256: a7499239d900ea4efe74df7dbd0db0c5c14abbd5980c0d324aa90cd2391a9879
  LIBUNICOWS_COMMIT: 394c41a69ae54d74886a387a1bebaf59c0b95222

jobs:
  build-win98:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout PianoFromDOS
        uses: actions/checkout@v4

      - name: Install host build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build nasm zstd

      - name: Download pinned Windows 98 cross-toolchain
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/redpanda-cpp/mingw-lite/releases/download/${MINGW_LITE_VERSION}/${MINGW_LITE_ARCHIVE}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$MINGW_LITE_ARCHIVE" "$url"
          echo "${MINGW_LITE_SHA256}  $RUNNER_TEMP/$MINGW_LITE_ARCHIVE" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mingw-win98"
          tar --zstd -xf "$RUNNER_TEMP/$MINGW_LITE_ARCHIVE" -C "$RUNNER_TEMP/mingw-win98"

      - name: Locate cross compiler and binutils
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mingw-win98"

          # mingw-lite's cross archives are assembled from multiple build stages.
          # GCC can live under AAB/gcc/... while target binutils live elsewhere, so
          # never assume that gcc/g++/ar/windres share one directory.
          cxx="$(find "$root" \( -type f -o -type l \) -name '*-g++' -print -quit)"
          if [[ -z "$cxx" || ! -x "$cxx" ]]; then
            echo "Could not find an executable cross g++ in $root" >&2
            find "$root" -type f -o -type l | sed -n '1,240p'
            exit 1
          fi

          triplet="$(basename "$cxx")"
          triplet="${triplet%-g++}"
          echo "Detected target triplet: $triplet"

          find_tool() {
            local tool="$1"
            local candidate=""

            # Prefer the canonical target-prefixed spelling anywhere in the archive.
            candidate="$(find "$root" \( -type f -o -type l \) -path '*/usr/local/bin/*' -name "${triplet}-${tool}" -print -quit)"
            if [[ -z "$candidate" ]]; then
              candidate="$(find "$root" \( -type f -o -type l \) -name "${triplet}-${tool}" -print -quit)"
            fi

            # GCC also ships plugin-aware wrappers named gcc-ar/gcc-ranlib.
            if [[ -z "$candidate" && "$tool" == "ar" ]]; then
              candidate="$(find "$root" \( -type f -o -type l \) -name "${triplet}-gcc-ar" -print -quit)"
            elif [[ -z "$candidate" && "$tool" == "ranlib" ]]; then
              candidate="$(find "$root" \( -type f -o -type l \) -name "${triplet}-gcc-ranlib" -print -quit)"
            fi

            if [[ -z "$candidate" || ! -x "$candidate" ]]; then
              echo "Could not find executable tool for ${triplet}-${tool}" >&2
              echo "Candidates containing '${tool}':" >&2
              find "$root" \( -type f -o -type l \) -iname "*${tool}*" -print | sed -n '1,120p' >&2
              return 1
            fi

            printf '%s\n' "$candidate"
          }

          cc="$(find_tool gcc)"
          ar="$(find_tool ar)"
          ranlib="$(find_tool ranlib)"
          strip="$(find_tool strip)"
          windres="$(find_tool windres)"
          objdump="$(find_tool objdump)"
          ld="$(find_tool ld)"

          {
            echo "PFD_CC=$cc"
            echo "PFD_CXX=$cxx"
            echo "PFD_AR=$ar"
            echo "PFD_RANLIB=$ranlib"
            echo "PFD_STRIP=$strip"
            echo "PFD_WINDRES=$windres"
            echo "PFD_OBJDUMP=$objdump"
            echo "PFD_LD=$ld"
          } >> "$GITHUB_ENV"

          echo "Resolved tools:"
          printf '  CC      %s\n' "$cc"
          printf '  CXX     %s\n' "$cxx"
          printf '  AR      %s\n' "$ar"
          printf '  RANLIB  %s\n' "$ranlib"
          printf '  STRIP   %s\n' "$strip"
          printf '  WINDRES %s\n' "$windres"
          printf '  OBJDUMP %s\n' "$objdump"
          printf '  LD      %s\n' "$ld"
          "$cxx" --version

      - name: Build libunicows import library
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ComputerNerd/Libunicows.git "$RUNNER_TEMP/libunicows"
          git -C "$RUNNER_TEMP/libunicows" checkout --detach "$LIBUNICOWS_COMMIT"
          make -C "$RUNNER_TEMP/libunicows/src" -f makefile.mingw32 \
            CC="$PFD_CC" \
            LD="$PFD_LD" \
            AR="$PFD_AR" \
            RANLIB="$PFD_RANLIB" \
            STRIP="$PFD_STRIP" \
            NASM=nasm \
            PATHSEP=/ \
            CFLAGS="-O2 -fcommon"
          test -f "$RUNNER_TEMP/libunicows/lib/mingw32/libunicows.a"
          echo "PFD_UNICOWS=$RUNNER_TEMP/libunicows/lib/mingw32/libunicows.a" >> "$GITHUB_ENV"

      - name: Generate CMake cross file
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/pianofromdos-win98.cmake" <<TOOLCHAIN
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86)
          set(CMAKE_SYSTEM_VERSION 4.10)
          set(CMAKE_C_COMPILER "$PFD_CC")
          set(CMAKE_CXX_COMPILER "$PFD_CXX")
          set(CMAKE_RC_COMPILER "$PFD_WINDRES")
          set(CMAKE_AR "$PFD_AR")
          set(CMAKE_RANLIB "$PFD_RANLIB")
          set(CMAKE_STRIP "$PFD_STRIP")
          set(CMAKE_LINKER "$PFD_LD")
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          TOOLCHAIN

      - name: Configure
        run: |
          cmake -S . -B build-win98 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/pianofromdos-win98.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPFD_UNICOWS_LIBRARY="$PFD_UNICOWS"

      - name: Build
        run: cmake --build build-win98 --config Release --verbose

      - name: Verify PE imports and architecture
        shell: bash
        run: |
          set -euo pipefail
          exe="build-win98/package/PianoFromDOS.exe"
          test -f "$exe"
          file "$exe" | tee build-win98/package/PE-INFO.txt
          file "$exe" | grep -Eqi 'PE32 executable.*Intel 80386|PE32 executable.*Intel i386'
          "$PFD_OBJDUMP" -p "$exe" > build-win98/package/PE-IMPORTS.txt
          grep -E 'DLL Name:' build-win98/package/PE-IMPORTS.txt || true
          grep -Eqi 'DLL Name:.*d3dx9_30\.dll' build-win98/package/PE-IMPORTS.txt
          if grep -Eqi 'DLL Name:.*(d3dx9_43|ucrtbase|api-ms-win|libstdc\+\+|libgcc_s|libwinpthread).*\.dll' build-win98/package/PE-IMPORTS.txt; then
            echo "Unexpected modern runtime DLL dependency detected" >&2
            exit 1
          fi

      - name: Strip release executable
        shell: bash
        run: |
          "$PFD_STRIP" build-win98/package/PianoFromDOS.exe

      - name: Upload Windows 98 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PianoFromDOS-Windows98-x86
          path: build-win98/package/
          if-no-files-found: error
          compression-level: 9
